name: CI

on:
  push:
    branches:
      - dev
      - release
    tags: ['**']
  pull_request:
    branches:
      - dev
      - release
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  check-and-test:
    name: Check, test, and build CLI and tool server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js for version metadata
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go race tests
        run: go test -race ./...

      - name: Build tjucli
        run: |
          CLI_VER=$(node -e "console.log(require('./package.json').version)")
          mkdir -p bin
          go build -trimpath -ldflags="-X main.version=${CLI_VER}" -o bin/tjucli ./cmd/tjucli
          go build -trimpath -o bin/tjucli-server ./cmd/tjucli-server

      - name: Verify binary output
        run: |
          ./bin/tjucli version --json

      - name: Upload tjucli artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tjucli-${{ github.sha }}
          path: |
            bin/tjucli
            bin/tjucli-server
          if-no-files-found: error
          retention-days: 7
